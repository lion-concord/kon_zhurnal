<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>КОН-программа лояльности</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: одноколоночное мобильное приложение 440px по центру, стеклянные карточки поверх медленного северного сияния,
   нижняя панель вкладок, переключатель Клиент / Бизнес в шапке. Один осознанный тёмный образ. */
:root{
  --bg:#05181B;          /* глубокая морская зелень */
  --ink:#F2FBF8;         /* тёплый белый с мятным оттенком */
  --mute:#8FB0AD;        /* приглушённый текст */
  --glass:rgba(242,251,248,.06);
  --glass2:rgba(242,251,248,.10);
  --line:rgba(242,251,248,.12);
  --coral:#FF6F59;       /* акцент */
  --gold:#FFD166;        /* награды, баллы */
  --mint:#3DDBB0;        /* успех, рост */
  --vk:#0077FF;
  --dark:#2B0F08;        /* текст на коралловом и золотом */
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 24px;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ico{width:22px;height:22px;flex:none}

/* фон */
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:380px;height:380px;left:-140px;top:-80px;background:#0FA3A3;opacity:.5}
.aurora i:nth-child(2){width:320px;height:320px;right:-150px;top:34%;background:var(--coral);opacity:.3;animation-delay:-6s}
.aurora i:nth-child(3){width:320px;height:320px;left:8%;bottom:-140px;background:var(--gold);opacity:.2;animation-delay:-11s}
@keyframes drift{to{transform:translate3d(46px,64px,0) scale(1.18)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes sheen{0%{transform:translateX(-140%) skewX(-18deg)}60%,100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes tick{0%{transform:translateY(0)}40%{transform:translateY(-4px);color:var(--ink)}100%{transform:translateY(0)}}

#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-width:0}
#main{padding-bottom:116px}
#view>*{animation:rise .35s ease both}

/* заставка */
[hidden]{display:none!important}
#splash{min-height:calc(100svh - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding-block:20px}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.logo{position:relative;width:148px;height:148px;display:grid;place-items:center;isolation:isolate}
.logo::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--coral),var(--gold),var(--mint),var(--coral));animation:spin 9s linear infinite;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.logo::after{content:"";position:absolute;inset:-18px;border-radius:50%;z-index:-1;
  background:conic-gradient(var(--coral),var(--gold),var(--mint),var(--coral));filter:blur(26px);opacity:.4;animation:spin 9s linear infinite}
.logo b{font:700 36px var(--f-display);letter-spacing:.03em}
.count{font:700 clamp(40px,13vw,56px)/1 var(--f-display);letter-spacing:-.02em;color:var(--gold);font-variant-numeric:tabular-nums}
.count.tick{animation:tick .5s ease}
.cap{color:var(--mute);max-width:26ch;margin:0 auto}
.faces{display:flex;justify-content:center}
.faces span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-body);color:var(--dark);border:2px solid var(--bg);margin-left:-9px}
.faces span:first-child{margin-left:0}
.fine{font-size:12px;color:var(--mute);max-width:34ch}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 18px;min-height:46px;
  font:700 15px var(--f-body);cursor:pointer;background:var(--coral);color:var(--dark);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold)}
.btn.vk{background:var(--vk);color:#fff;width:100%;max-width:340px;min-height:54px;font-size:16px;border-radius:18px}
.btn.vk em{font:700 12px var(--f-body);font-style:normal;background:#fff;color:var(--vk);border-radius:7px;padding:3px 6px}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px;border-radius:13px}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.mark{display:flex;align-items:center;gap:8px;font:700 17px var(--f-display);letter-spacing:.04em}
.mark i{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--coral),var(--gold),var(--mint),var(--coral))}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--glass2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mute);font:600 13px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:#06201F}
.roles{display:flex;padding:3px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);margin:0 0 14px}
.roles button{flex:1;border:0;background:transparent;color:var(--mute);font:600 13px var(--f-body);padding:8px 4px;border-radius:999px;cursor:pointer;min-height:38px}
.roles button.on{background:var(--ink);color:#06201F}
.web{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:0}
.linkrow code{font:600 13px var(--f-body);color:var(--ink);word-break:break-all}
.hero{border-radius:24px;padding:20px 18px;margin-bottom:12px;background:linear-gradient(140deg,rgba(255,111,89,.28),rgba(255,209,102,.18) 55%,rgba(61,219,176,.22));border:1px solid var(--line)}
.hero h1{font:700 24px/1.15 var(--f-display);margin:0 0 6px}
.invite{border-radius:24px;padding:22px 18px;margin:6px 0 14px;text-align:center;background:linear-gradient(150deg,var(--coral),#B8453A 60%,#7A2B3A);color:#fff}
.invite b{display:block;font:700 22px/1.2 var(--f-display);margin-bottom:8px}
.invite .code{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.25);font:700 17px var(--f-display);letter-spacing:.08em}
.field.num{font-size:22px;font-weight:700}

.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;flex:none}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--dark);font:700 11px/18px var(--f-body);text-align:center;padding:0 4px}

/* типографика страниц */
.h1{font:700 24px/1.18 var(--f-display);text-wrap:balance;margin:4px 0 6px}
.sub{color:var(--mute);margin-bottom:16px}
.sec{margin:24px 0 10px;font:700 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row>.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,209,102,.16);color:var(--gold);font:700 12px var(--f-body);white-space:nowrap}
.chip.mint{background:rgba(61,219,176,.15);color:var(--mint)}
.chip.coral{background:rgba(255,111,89,.18);color:var(--coral)}
.meter{height:8px;border-radius:99px;background:var(--glass2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--gold))}

/* карта лояльности */
.loyal{position:relative;overflow:hidden;border:0;color:var(--dark);padding:18px;
  background:linear-gradient(135deg,#FF7A62 0%,#FFB45E 62%,#FFD166 100%);box-shadow:0 18px 50px -18px rgba(255,111,89,.65)}
.loyal .sheen{position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);animation:sheen 5.5s ease-in-out infinite;pointer-events:none}
.loyal .lab{font:600 13px var(--f-body);color:#3A1810}
.loyal .lvl{font:700 20px var(--f-display)}
.loyal .cb{background:rgba(43,15,8,.14);border-radius:99px;padding:6px 12px;font:700 13px var(--f-body)}
.loyal .pts{display:flex;align-items:baseline;gap:8px;margin:14px 0 4px;font:700 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.loyal .pts small{font:700 15px var(--f-body)}
.loyal .track{height:8px;border-radius:99px;background:rgba(43,15,8,.18);overflow:hidden;margin:10px 0 8px}
.loyal .track i{display:block;height:100%;background:var(--dark);border-radius:99px}
.qrrow{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px dashed rgba(43,15,8,.35)}
.qr{width:92px;height:92px;flex:none;background:#FFF6EC;border-radius:12px;padding:8px}
.qr svg{display:block;width:100%;height:100%}
.code{font:700 17px var(--f-display);letter-spacing:.02em;margin:2px 0 4px}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:12px;border-radius:18px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font:600 13px/1.25 var(--f-body);min-width:0}
.quick button .ico{color:var(--gold)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 220px;min-width:0;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;display:block}
.mini b{display:block;margin:8px 0 2px}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.plus{font:700 15px var(--f-body);color:var(--mint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* акции */
.bubble{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,111,89,.16);color:var(--coral)}
.bubble.gold{background:rgba(255,209,102,.16);color:var(--gold)}
.bubble.mint{background:rgba(61,219,176,.16);color:var(--mint)}
.promo h3{font:700 16px var(--f-body)}
.promo p{color:var(--mute);margin:8px 0 12px}
.on-state{background:rgba(61,219,176,.16);color:var(--mint)}

/* игры */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;background:var(--glass);border:1px solid var(--line);font:700 12px var(--f-body);min-width:0}
.day .ico{width:18px;height:18px}
.day.done{background:rgba(61,219,176,.16);color:var(--mint);border-color:transparent}
.day.today{border-color:var(--gold);color:var(--gold)}
.wheelwrap{position:relative;width:min(280px,82%);aspect-ratio:1;margin:8px auto 14px}
.wheelbox{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.7,.12,1);border-radius:50%;box-shadow:0 0 0 6px var(--glass2),0 20px 50px -16px rgba(255,111,89,.5)}
.wheelbox svg{display:block;width:100%;height:100%}
.pointer{position:absolute;left:50%;top:-10px;width:26px;height:30px;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.task .meter{margin:10px 0 0}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font:600 12px/1.25 var(--f-body);min-width:0}
.badge .hex{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--coral),var(--gold));color:var(--dark)}
.badge.lock{opacity:.5}
.badge.lock .hex{background:var(--glass2);color:var(--mute)}
.rank{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank.me{color:var(--gold);font-weight:700}
.rank .n{font:700 14px var(--f-display);color:var(--mute)}

/* друзья */
.refcode{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--glass2);border:1px dashed rgba(242,251,248,.3);margin:12px 0}
.refcode b{font:700 20px var(--f-display);letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{padding:12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);min-width:0}
.stat b{display:block;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}

/* чат */
.thread{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 17px var(--f-display);background:linear-gradient(135deg,var(--coral),var(--gold));color:var(--dark)}
.av.t2{background:linear-gradient(135deg,#0FA3A3,var(--mint))}
.av.t3{background:linear-gradient(135deg,var(--gold),#FFF1C4)}
.thread .grow{flex:1;min-width:0}
.thread b{display:block}
.thread span.last{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:var(--dark);font:700 12px/22px var(--f-body);text-align:center;padding:0 6px}
.chead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:96px}
.msg{max-width:82%;padding:9px 12px 6px;border-radius:18px;background:var(--glass2);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--coral);color:var(--dark);border-color:transparent}
.msg b{display:block;font-size:12px;color:var(--gold);margin-bottom:2px}
.msg time{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:2px}
.dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,440px);z-index:20;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,transparent,var(--bg) 40%);display:flex;gap:8px}
.dock input{flex:1;min-width:0}
.field{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(5,24,27,.7);color:var(--ink);font:400 15px var(--f-body);padding:11px 14px}
textarea.field{min-height:84px;resize:vertical}
select.field{appearance:auto}
label.lbl{display:block;font:600 13px var(--f-body);color:var(--mute);margin:12px 0 6px}

/* нижняя панель */
#tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,440px);z-index:20;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#tabbar .bar{display:flex;gap:2px;padding:6px;border-radius:26px;background:rgba(8,38,41,.78);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:0 14px 40px -12px rgba(0,0,0,.6)}
#tabbar button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--mute);
  padding:8px 0 7px;border-radius:20px;font:600 11px var(--f-body);cursor:pointer}
#tabbar button.on{background:var(--glass2);color:var(--gold)}
#tabbar .pip{position:absolute;top:6px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--coral)}

/* бизнес */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);min-width:0}
.kpi span{display:block;font-size:12px;color:var(--mute)}
.kpi b{display:block;font:700 22px/1.2 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.wide{grid-column:1/-1;background:linear-gradient(135deg,rgba(255,111,89,.25),rgba(255,209,102,.16));border-color:rgba(255,209,102,.3)}
.kpi.wide b{font-size:30px;color:var(--gold)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--line);padding-top:6px}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--glass2)}
.bars div.cur i{background:linear-gradient(180deg,var(--coral),var(--gold))}
.bars div.cur{color:var(--ink)}
.axis{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--mute)}
.axis span{flex:1;text-align:center;min-width:0}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0 12px}
.stack i{display:block;height:100%}
.legend{display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:10px}
.legend s{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.sw{position:relative;width:50px;height:30px;border-radius:99px;border:0;background:var(--glass2);cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--mint)}
.sw[aria-pressed="true"]::after{transform:translateX(20px);background:#06201F}
.preview{border-radius:20px;padding:12px 14px;background:rgba(242,251,248,.92);color:#06201F;margin:12px 0}
.preview small{display:block;color:#47615E;font-size:12px}
.preview b{display:block;margin:2px 0}

function confetti(){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 var c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 var cols=['#FF6F59','#FFD166','#3DDBB0','#F2FBF8'];
 var P=[];for(var i=0;i<90;i++)P.push({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,s:5+Math.random()*5,c:cols[i%4],r:Math.random()*6,vr:(Math.random()-.5)*.4});
 var f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});f++;if(f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
function qrSVG(){
 var s=1337,r=function(){s=(s*1664525+1013904223)>>>0;return s/4294967296},N=21,F=[[0,0],[14,0],[0,14]],out='';
 var near=function(x,y){return F.some(function(f){return x>=f[0]-1&&x<=f[0]+7&&y>=f[1]-1&&y<=f[1]+7})};
 var fin=function(x,y){return F.some(function(f){var dx=x-f[0],dy=y-f[1];if(dx<0||dy<0||dx>6||dy>6)return false;return dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)})};
 for(var y=0;y<N;y++)for(var x=0;x<N;x++){var on=near(x,y)?fin(x,y):r()>.52;if(on)out+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
 return '<svg viewBox="0 0 21 21" fill="#2B0F08" shape-rendering="crispEdges" aria-label="Код клиента, пример">'+out+'</svg>';
}
function wheelSVG(){
 var p='',R=120;
 PR.forEach(function(x,i){
  var c=i*45-90,a0=(c-22.5)*Math.PI/180,a1=(c+22.5)*Math.PI/180;
  var x0=(R*Math.cos(a0)).toFixed(2),y0=(R*Math.sin(a0)).toFixed(2),x1=(R*Math.cos(a1)).toFixed(2),y1=(R*Math.sin(a1)).toFixed(2);
  var fill=i%2===0?(i%4===0?'#FF6F59':'#FFD166'):(i%4===1?'#12383B':'#0E4A4B');
  var tc=i%2===0?'#2B0F08':'#F2FBF8';
  p+='<path d="M0 0L'+x0+' '+y0+'A'+R+' '+R+' 0 0 1 '+x1+' '+y1+'Z" fill="'+fill+'" stroke="rgba(5,24,27,.7)" stroke-width="1.5"/>'+
     '<text transform="rotate('+c+') translate(78 0)" text-anchor="middle" dominant-baseline="central" fill="'+tc+'" font-family="Unbounded,Arial Black,sans-serif" font-weight="700" font-size="'+(x.l.length>4?12:15)+'">'+x.l+'</text>';
 });
 return '<svg viewBox="-130 -130 260 260" aria-label="Колесо удачи">'+p+'<circle r="16" fill="#05181B" stroke="rgba(242,251,248,.35)" stroke-width="2"/></svg>';
}

  var b=B(),before=lvIdx(b),p=Math.round(b.buy*b.cb[before]/100);
  b.spent+=b.buy;bump(b,'buy');addPts(b,p,'Покупка на '+fmt(b.buy)+' ₽');

  else toast('Начислено +'+p+' баллов, действуют 30 дней');
  render()},
 redeem:function(){
  var b=B(),n=spend(b,100);
  if(!n){toast('Баллов пока нет');return}
  b.hist.unshift({t:'Оплата баллами',d:'Сегодня',p:-n});toast('Списано '+n+', сначала самые старые');render()},
 time:function(){
  var b=B(),burned=0;
  b.lots.forEach(function(l){l.d-=10});
  b.lots=b.lots.filter(function(l){if(l.d<=0){burned+=l.p;return false}return true});
  if(burned){b.hist.unshift({t:'Баллы сгорели',d:'Сегодня',p:-burned})}
  var s3=S.remind?soon(b,7):soon(b,3);
  if(s3>0){
   var t='Через '+days(minD(b))+' сгорит '+fmt(s3)+' '+plural(s3,['балл','балла','баллов']);
   S.notifs.unshift({t:t,b:'Загляните в «'+b.n+'» и потратьте баллы.',d:'Сегодня, '+nowT(),biz:b.n});S.unread++;banner(t,b.n)}
  else toast(burned?'Сгорело '+fmt(burned)+' '+plural(burned,['балл','балла','баллов']):'Прошло 10 дней');
  render()},

 join:function(el){var c=B().camps.filter(function(x){return x.id===el.dataset.id})[0];c.me=!c.me;c.part+=c.me?1:-1;toast(c.me?'Вы участвуете в акции':'Участие отменено');render()},
 claim:function(){var b=B();if(b.claimed||b.streak>=7)return;var p=REW[b.streak];b.streak++;b.claimed=true;var t=b.tasks.filter(function(x){return x.id==='streak'})[0];t.prog=b.streak;addPts(b,p,'Ежедневная отметка');confetti();toast('Отмечено, +'+p+' баллов');render()},
 taskClaim:function(el){var b=B(),t=b.tasks.filter(function(x){return x.id===el.dataset.id})[0];if(!t||t.done||t.prog<t.goal)return;t.done=true;addPts(b,t.rew,'Задание: '+t.t);confetti();render()},
 spin:function(){
  var b=B();if(b.spun||S.spinning)return;S.spinning=true;
  var tot=sum(PR,function(p){return p.w}),r=Math.random()*tot,k=0;for(;k<PR.length;k++){r-=PR[k].w;if(r<0)break}if(k>=PR.length)k=PR.length-1;
  var delta=(((-k*45-b.wheel)%360)+360)%360,jit=(Math.random()-.5)*28;
  b.wheel=b.wheel+360*5+delta+jit;
  $('#wheelBox').style.transform='rotate('+b.wheel+'deg)';$('#spinBtn').disabled=true;
  var from=b.id;
  setTimeout(function(){
   S.spinning=false;b.spun=true;b.spunEver=true;bump(b,'spin');var pr=PR[k];
   if(pr.pts)addPts(b,pr.pts,'Колесо удачи');else b.hist.unshift({t:'Колесо удачи: '+pr.gift,d:'Сегодня',p:0});
   confetti();render();openSheet(prizeSheet(pr))},4400)},
 copy:function(){var done=function(){toast('Код скопирован')};try{navigator.clipboard.writeText('ANNA-4K7').then(done,function(){toast('Код: ANNA-4K7')})}catch(e){toast('Код: ANNA-4K7')}},

  toast('Друг вступил, +100 баллов в «'+b.short+'»');render()},

 back:function(){S.chat.open=null;render();window.scrollTo(0,0)},
 send:function(){

  },1300)},
